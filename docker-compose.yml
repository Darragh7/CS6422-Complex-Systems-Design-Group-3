services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Supabase PostgreSQL connection string in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY:-}
      FOOTBALL_API_BASE_URL: ${FOOTBALL_API_BASE_URL:-https://api.football-data.org/v4}
    ports:
      - "8002:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./Django
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./Django:/app
    restart: unless-stopped
