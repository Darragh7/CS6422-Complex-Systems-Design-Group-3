apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoreline-backend
  namespace: scoreline
  labels:
    app.kubernetes.io/name: scoreline-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scoreline-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoreline-backend
    spec:
      containers:
        - name: backend
          image: scoreline-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: scoreline-config
            - secretRef:
                name: scoreline-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
